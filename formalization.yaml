    their required dependencies. The statement interface counts generator
    and relator slots. No optimality or minimality claim, four-manifold
    theorem, or general theorem about all Markov properties is within scope.
  # Counts refer to the proved library; the three deliberate theorem holes
  # in the independent Challenge.lean statement file are excluded.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
