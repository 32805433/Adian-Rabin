# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Small undecidable groups and fixed-size Adian–Rabin families"
  description: >-
    Lean 4 proofs of the algebraic results in Small undecidable groups and
    unrecognizable 4-manifolds (arXiv:2609.10461v1): existence of a group with
    a three-generator, nine-relator presentation and unsolvable word problem;
    an effective family of four-generator, eleven-relator presentations with
    undecidable triviality; and an effective family of two-generator,
    ten-relator presentations with undecidable triviality. These are
    Theorems 1.1, 1.3, and 1.4 of the paper. The
    four-manifold consequences in the paper are outside the formalized scope.
  authors:
    - "Marc Kegel"
    - "Shana Yunsheng Li"
    - "Qiuyu Ren"
  responsible_maintainers:
    - "Qiuyu Ren"
  license: "MIT"

# This repository contains the substantive modular proof development.
sources:
  - title: "Small undecidable groups and unrecognizable 4-manifolds"
    authors: ["Marc Kegel", "Shana Yunsheng Li", "Qiuyu Ren"]
    id: "https://arxiv.org/abs/2609.10461v1"
    type: "paper"
    location: "Theorems 1.1, 1.3, and 1.4; Section 1.6 describes the formalization"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Source for all three compared declarations. Corollary 1.5 on
      unrecognizable four-manifolds is not formalized.
  - title: "Simple examples of groups with unsolvable word problem"
    authors: ["V. V. Borisov"]
    id: "https://doi.org/10.1007/BF01101402"
    type: "paper"
    relationship: "adapts"
    note: >-
      Borisov's group simulation is proved in Lean. Further HNN embeddings
      and Tietze eliminations produce the three-generator, nine-relator host.
  - title: "Word problem for Thue systems with a few relations"
    authors: ["Yuri Matiyasevich"]
    id: "https://doi.org/10.1007/3-540-59340-3_4"
    type: "paper"
    relationship: "adapts"
    note: >-
      The formalization uses the 1995 compression route to a binary
      three-rule Thue system, followed by a synchronization encoding.
      It does not follow the 1967 construction initially considered.
  - title: "Recursive unsolvability of a problem of Thue"
    authors: ["Emil L. Post"]
    id: "https://doi.org/10.2307/2267170"
    type: "paper"
    relationship: "adapts"
    note: >-
      Machine-to-Thue simulation supplies the finite undecidable rewriting
      seed; the required arguments are proved rather than postulated.
  - title: "Decision problems for groups—survey and reflections"
    authors: ["Charles F. Miller III"]
    id: "https://doi.org/10.1007/978-1-4613-9730-4_1"
    type: "paper"
    relationship: "adapts"
    note: "Source for the Miller–Tancer reduction used in the four-generator family."
  - title: "Simpler algorithmically unrecognizable 4-manifolds"
    authors: ["Martin Tancer"]
    id: "https://arxiv.org/abs/2310.07421v2"
    type: "paper"
    location: "Theorem 9 and the Adian–Rabin construction"
    relationship: "adapts"
    note: >-
      A compressed Miller–Tancer construction uses a displayed normal
      generator to obtain n+1 generators and m+2 relators from an n-generator,
      m-relator host. With the three-nine host this gives the four-eleven family.
  - title: "On the homeomorphism problem for 4-manifolds"
    authors: ["Cameron McA. Gordon"]
    id: "https://doi.org/10.53733/205"
    type: "paper"
    location: "Condition (2.1) and Lemma 2.1"
    relationship: "adapts"
    note: >-
      Gordon's algebraic reduction is proved in Lean and applied to the
      three-nine host. A host generator trivial in the abelianization
      verifies the required condition. The topology is not formalized.
  - title: "The Word Problem for Groups"
    authors: ["J. L. Britton"]
    id: "https://doi.org/10.1112/plms/s3-8.4.493"
    type: "paper"
    relationship: "background"
    note: "Background for the HNN normal-form arguments."
  - title: "Formalizing Computability Theory via Partial Recursive Functions"
    authors: ["Mario Carneiro"]
    id: "https://doi.org/10.4230/LIPIcs.ITP.2019.12"
    type: "paper"
    relationship: "background"
    note: "Background for Mathlib's partial-recursive computability framework."

