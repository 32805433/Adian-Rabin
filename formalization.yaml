automation:
  methods:
    - method: "agent"
      models: ["GPT-5.6 Sol Pro"]
      tool_setup: "Informal proof development, as reported in the paper, Section 1.6."
      prompting_notes: "Produced an informal proof of Theorem 1.1 in a companion PDF."
    - method: "agent"
      models: ["GPT-5.6 Sol"]
      framework: "Codex"
      tool_setup: >-
        Lean 4 and Mathlib, with iterative compilation, literature-guided
        proof development, source audits, and statement verification.
      prompting_notes: >-
        Formalized statements and a proof skeleton, discharged all temporary
        axioms, constructed the Post/Matiyasevich route, formalized both
        Adian–Rabin reductions, and audited and reorganized the development.
    - method: "agent"
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: >-
        Preparation and editing of project documentation, structured metadata,
        and verification configuration; local build, axiom, and statement
        verification. This method did not generate the mathematical proofs.
  notes: >-
    Essentially all Lean code was generated with AI assistance under human
    direction. The paper, Section 1.6, reports manual checking of the theorem
    statements. Detailed cost and runtime measurements are not available.

fidelity:
  divergences: >-
    The Lean interface represents a presentation by exactly n generator
    slots and m relator slots, without claiming these counts are minimal or
    that relators are distinct. An Adian–Rabin family is a total computable
    sequence of relator tuples with an undecidable set of trivial-group
    indices; the paper phrases this as a recursively enumerable family
    with undecidable triviality. This effective indexing gives such a
    family: a decision procedure on its presentations would decide its
    indices by composition. The Thue-system input is proved using Post's
    machine simulation and Matiyasevich's 1995 compression.
    Only the algebraic Theorems 1.1, 1.3, and 1.4 are represented here.
    The topological and smooth conclusions of Corollary 1.5 are not checked.

review:
  status: "self-assessed"
  notes: >-
    Section 1.6 of the paper reports that the authors manually checked the
    formal statements and used Codex for proof and axiom audits, followed
    by automated statement comparison and Lean kernel replay. This is not
    a claim of independent human review of all proof code. AXIOM_AUDIT.md
    records the local checks and their scope. NanoDa replay was not
    performed in that verification run.

alignment:
  namespace: "Undecidability"
  statements:
    - source: "arXiv:2609.10461v1, Theorem 1.1"
      lean: "Undecidability.exists_three_generator_nine_relator_group_with_unsolvable_word_problem"
      module: "GroupUndecidability"
      status: "proved"
    - source: "arXiv:2609.10461v1, Theorem 1.3"
      lean: "Undecidability.exists_four_generator_eleven_relator_adian_rabin_family"
      module: "GroupUndecidability"
      status: "proved"
    - source: "arXiv:2609.10461v1, Theorem 1.4"
      lean: "Undecidability.exists_two_generator_ten_relator_adian_rabin_family"
      module: "GroupUndecidability"
      status: "proved"
